name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Calidad, seguridad y contratos
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Activar pnpm exacto
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm --version

      - name: Dependencias nativas de captura
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpcap-dev

      - name: Instalar desde lockfile
        run: pnpm install --frozen-lockfile

      - name: QA completo
        run: pnpm run qa

      - name: Documentación y diagramas
        run: pnpm run docs:check

      - name: Inmutabilidad de imágenes
        run: pnpm run containers:check

      - name: Inventario de licencias
        run: pnpm run licenses:check

      - name: Auditoría de dependencias
        run: |
          pnpm audit --audit-level=low
          pnpm audit --prod --audit-level=low

      - name: Fixture sintético de reportes
        run: pnpm run qa:report-fixture

      - name: Contratos Compose
        env:
          MONGODB_URI: mongodb://synthetic:synthetic@mongo.invalid:27017/wp-monitor
          REDIS_URL: redis://synthetic:synthetic@redis.invalid:6379
          PUBLIC_BASE_URL: https://monitor.example.invalid
          CAPTURE_AGENT_SHARED_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BROWSER_VNC_PASSWORD: synthetic-vnc-password
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f deploy/docker-compose.dokploy.yml config --quiet

      - name: Publicar evidencia sintética
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-fixture-${{ github.sha }}
          path: .runtime-logs/report-fixture
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: Construcción Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    env:
      MONGODB_URI: mongodb://synthetic:synthetic@mongo.invalid:27017/wp-monitor
      REDIS_URL: redis://synthetic:synthetic@redis.invalid:6379
      PUBLIC_BASE_URL: https://monitor.example.invalid
      CAPTURE_AGENT_SHARED_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      BROWSER_VNC_PASSWORD: synthetic-vnc-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir las cuatro unidades de aplicación
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f deploy/docker-compose.dokploy.yml build backend client capture-agent wa-browser

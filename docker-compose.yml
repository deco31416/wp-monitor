services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${BACKEND_PORT:-4000}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    env_file:
      - .env
    environment:
      - PORT=${BACKEND_PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      # Persist WhatsApp auth state
      - baileys_auth:/app/auth_info_baileys
      # Persist Authorized Check-In preview uploads
      - checkin_uploads:/app/public/uploads
    networks:
      - app-network
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - PORT=${CLIENT_PORT:-4001}
        - REACT_APP_API_URL=${BACKEND_URL:-http://localhost:4000}
    ports:
      - "${CLIENT_PORT:-4001}:${CLIENT_PORT:-4001}"
    environment:
      - PORT=${CLIENT_PORT:-4001}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  baileys_auth:
    driver: local
  checkin_uploads:
    driver: local

networks:
  app-network:
    driver: bridge

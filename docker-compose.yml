services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=${NODE_VERSION:-24.19.0}
        - PORT=${BACKEND_PORT:-4000}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    env_file:
      - .env
    environment:
      - PORT=${BACKEND_PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
      - REDIS_URL=redis://redis:6379
      - REDIS_REQUIRED=true
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-wp-monitor}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Persist WhatsApp auth state
      - baileys_auth:/app/auth_info_baileys
      # Persist Authorized Check-In preview uploads
      - checkin_uploads:/app/public/uploads
    networks:
      - app-network
      - data-network
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - data-network
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - NODE_VERSION=${NODE_VERSION:-24.19.0}
        - PORT=${CLIENT_PORT:-4001}
        - VITE_API_URL=${BACKEND_URL:-http://localhost:4000}
    ports:
      - "${CLIENT_PORT:-4001}:${CLIENT_PORT:-4001}"
    environment:
      - PORT=${CLIENT_PORT:-4001}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  baileys_auth:
    driver: local
  checkin_uploads:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
  data-network:
    driver: bridge
    internal: true
